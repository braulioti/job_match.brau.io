openapi: 3.0.3
info:
  title: Job Match API
  description: API para avaliação de currículos e vagas de emprego usando Inteligência Artificial
  version: 1.0.0
  contact:
    name: Bráulio Figueiredo
    email: jobmatch@brau.io
    url: https://brau.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5000
    description: Servidor de desenvolvimento local
  - url: https://api.jobmatch.brau.io
    description: Servidor de produção

tags:
  - name: Health
    description: Endpoints de verificação de saúde da API

paths:
  /health:
    get:
      tags:
        - Health
      summary: Verificação de saúde da API
      description: Retorna o status de saúde da API
      operationId: healthCheck
      responses:
        '200':
          description: API está funcionando corretamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Mensagem de erro
        message:
          type: string
          description: Detalhes do erro
      required:
        - error

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - healthy
            - unhealthy
          description: Status da API

  responses:
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    
    InternalServerError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

