<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job Match API - Swagger Docs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #swagger-ui {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script>
      window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const language =
          urlParams.get("language") || {{ language|tojson|safe }};

        const specUrl = `/openapi?language=${encodeURIComponent(language)}`;

        window.ui = SwaggerUIBundle({
          dom_id: "#swagger-ui",
          url: specUrl,
        });
      };
    </script>
  </body>
  </html>
