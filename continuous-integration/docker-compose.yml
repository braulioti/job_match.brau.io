version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: continuous-integration/Dockerfile
    container_name: job-match-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - job-match-network

networks:
  job-match-network:
    driver: bridge

